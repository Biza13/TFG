parameters:

services:
    _defaults:
        autowire: true      
        autoconfigure: true 

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Listener para que jwt devuelva mas cosas a parte del token
    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccessResponse }

    # Para el servicio de mailer pero en despliegue "Gratuito"
    App\Email\BrevoMailer:
        arguments:
            $apiKey: '%env(BREVO_API_KEY)%'

    App\Service\CloudinaryService: ~